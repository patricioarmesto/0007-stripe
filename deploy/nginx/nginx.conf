server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri /index.html; }

    # El frontend nunca habla con los puertos internos: nginx es la puerta.
    location = /api/payments { proxy_pass http://payments:8081/payments; }
    # El health de payments vive en /health (no en /payments/health).
    location = /api/payments/health { proxy_pass http://payments:8081/health; }
    # /api/payments/:id → /payments/:id: el handler necesita el prefijo /payments.
    location /api/payments/ {
        rewrite ^/api/payments/(.*)$ /payments/$1 break;
        proxy_pass http://payments:8081;
    }
    location = /api/webhooks { proxy_pass http://webhook:8082/webhooks; }
    location = /api/webhooks/health { proxy_pass http://webhook:8082/health; }
    # /api/webhooks/simulate → /webhooks/simulate (y lo mismo para retry).
    location /api/webhooks/ {
        rewrite ^/api/webhooks/(.*)$ /webhooks/$1 break;
        proxy_pass http://webhook:8082;
    }
    location /api/stats { proxy_pass http://dashboard:8083; }
}
